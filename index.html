<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Best Part Love</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000 !important; overflow: hidden; }
        canvas { display: block; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; cursor: pointer;
        }
        .play-btn { font-size: 70px; filter: drop-shadow(0 0 20px #ff0055); animation: pulse 1.5s infinite; }
        #overlay h1 { color: #ff0055; font-size: 0.9rem; letter-spacing: 4px; margin-top: 25px; font-family: sans-serif; font-weight: bold; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="overlay" onclick="startApp()">
        <div class="play-btn">❤️</div>
        <h1>TAP TO START MUSIC</h1>
    </div>

    <!-- AUDIO DENGAN PENGATURAN KHUSUS BROWSER HP -->
    <audio id="myAudio" loop preload="auto" crossorigin="anonymous">
        <source src="https://edgeone.app" type="audio/mpeg">
    </audio>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('myAudio');
        let isStarted = false;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let stars = [];
        let fireworks = [];
        let showCount = 0;
        let pulse = 0;
        const colors = ['#ff0044', '#ff0066', '#ff3388', '#e600ff'];

        function startApp() {
            // Memaksa audio jalan (Fix untuk HP)
            audio.play().then(() => {
                console.log("Audio playing");
            }).catch(err => {
                console.log("Audio failed, link might be blocked", err);
            });
            
            document.getElementById('overlay').style.display = 'none';
            isStarted = true;
        }

        function getHeartPoint(t, scale) {
            let x = 16 * Math.sin(t) ** 3;
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * scale, y: y * scale };
        }

        class Particle {
            constructor(tx, ty, size, color) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.tx = tx;
                this.ty = ty;
                this.size = size;
                this.color = color;
                this.speed = 0.015; 
            }
            update() {
                this.x += (this.tx - this.x) * this.speed;
                this.y += (this.ty - this.y) * this.speed;
            }
            draw() {
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function init() {
            particles = [];
            stars = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scaleBig = Math.min(canvas.width, canvas.height) / 25;

            for (let i = 0; i < 750; i++) {
                const t = (i / 750) * Math.PI * 2;
                const pos = getHeartPoint(t, scaleBig);
                const color = colors[Math.floor((i / 750) * colors.length)];
                particles.push(new Particle(centerX + pos.x, centerY + pos.y, 2.8, color));
            }

            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    size: Math.random() * 1.5, opacity: Math.random(),
                    speed: 0.01 + Math.random() * 0.02
                });
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(s => {
                s.opacity += s.speed;
                if (s.opacity > 1 || s.opacity < 0) s.speed *= -1;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.opacity)})`;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
            });

            if (isStarted) {
                if (showCount < particles.length) showCount += 1.8;
                for (let i = 0; i < Math.floor(showCount); i++) {
                    if(particles[i]) {
                        particles[i].update();
                        particles[i].draw();
                    }
                }

                if (showCount >= particles.length) {
                    pulse += 0.04;
                    let s = (Math.min(canvas.width, canvas.height) / 85) * (1 + Math.sin(pulse) * 0.1);
                    ctx.save();
                    ctx.beginPath();
                    ctx.shadowBlur = 40;
                    ctx.shadowColor = "#ff0055";
                    ctx.fillStyle = "rgba(255, 0, 85, 0.4)";
                    for (let t = 0; t <= Math.PI * 2; t += 0.05) {
                        const pos = getHeartPoint(t, s);
                        if (t === 0) ctx.moveTo(canvas.width/2 + pos.x, canvas.height/2 + pos.y);
                        else ctx.lineTo(canvas.width/2 + pos.x, canvas.height/2 + pos.y);
                    }
                    ctx.fill();
                    ctx.restore();

                    if (Math.random() < 0.1) {
                        const x = Math.random() * canvas.width;
                        const y = Math.random() * canvas.height;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        for (let i = 0; i < 35; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = Math.random() * 5 + 2;
                            fireworks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, alpha: 1, color });
                        }
                    }
                }
            }

            fireworks.forEach((f, i) => {
                f.x += f.vx; f.y += f.vy; f.alpha -= 0.012;
                ctx.globalAlpha = f.alpha;
                ctx.fillStyle = f.color;
                ctx.beginPath(); ctx.arc(f.x, f.y, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
                if (f.alpha <= 0) fireworks.splice(i, 1);
            });

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
