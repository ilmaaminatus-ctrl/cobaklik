<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! ✨</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      overflow: hidden;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    .content { position: relative; z-index: 1; text-align: center; display: none; }

    /* Desain Kue Tingkat Mewah */
    .cake-container { position: relative; margin: 0 auto; width: 200px; height: 180px; }
    
    .tier { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 10px 10px 5px 5px; box-shadow: inset 0 -5px rgba(0,0,0,0.1); }
    
    /* Tingkat Bawah */
    .tier-1 { width: 160px; height: 50px; background: #FF69B4; bottom: 0; }
    /* Tingkat Tengah */
    .tier-2 { width: 120px; height: 45px; background: #FFB6C1; bottom: 50px; }
    /* Tingkat Atas */
    .tier-3 { width: 80px; height: 40px; background: #FFF0F5; bottom: 95px; }

    /* Krim Meleh (Drip) */
    .drip { position: absolute; width: 100%; height: 15px; background: #f0f0f0; border-radius: 0 0 10px 10px; top: 0; opacity: 0.8; }
    
    /* Stroberi di Atas */
    .strawberry { position: absolute; width: 15px; height: 18px; background: #ff0000; border-radius: 50% 50% 40% 40%; top: -15px; left: 50%; transform: translateX(-50%); box-shadow: inset -2px -2px #b30000; }

    /* Lilin Hidup */
    .candle { position: absolute; width: 6px; height: 25px; background: #fff; top: -35px; left: 50%; transform: translateX(-50%); border-radius: 3px; display: none; }
    .flame { position: absolute; width: 10px; height: 15px; background: #FFA500; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; top: -15px; left: -2px; animation: flicker 0.1s infinite alternate; box-shadow: 0 0 10px #FFD700; }

    @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }

    /* Animasi Teks */
    #message { font-size: 2.2rem; margin-top: 30px; min-height: 60px; font-weight: bold; }
    .word { display: inline-block; opacity: 0; transform: scale(0.5); transition: 0.5s; margin: 0 5px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
    .word.pop { opacity: 1; transform: scale(1); }

    .btn-start { padding: 15px 40px; font-size: 1.2rem; background: linear-gradient(45deg, #FF69B4, #FF1493); border: none; border-radius: 50px; color: white; cursor: pointer; box-shadow: 0 5px 20px rgba(255,20,147,0.4); z-index: 2; transition: 0.3s; }
  </style>
</head>
<body>

<!-- Lagu Happy Birthday -->
<audio id="hbdSong">
  <source src="https://githubusercontent.com" type="audio/mpeg">
  <!-- Jika link di atas tidak jalan, otomatis pakai cadangan instrumen tenang -->
  <source src="https://bensound.com" type="audio/mpeg">
</audio>

<canvas id="fwCanvas"></canvas>

<button class="btn-start" id="startBtn" onclick="initSurprise()">Buka Hadiah ✨</button>

<div class="content" id="mainContent">
  <div class="cake-container">
    <div class="tier tier-1"><div class="drip"></div></div>
    <div class="tier tier-2"><div class="drip"></div></div>
    <div class="tier tier-3">
      <div class="drip"></div>
      <div class="strawberry"></div>
      <div class="candle" id="candle">
        <div class="flame"></div>
      </div>
    </div>
  </div>
  <div id="message"></div>
</div>

<script>
  const canvas = document.getElementById('fwCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      this.vel = { x: Math.random() * 6 - 3, y: Math.random() * 6 - 3 };
      this.alpha = 1; this.friction = 0.95; this.gravity = 0.1;
    }
    draw() {
      ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = this.color; ctx.fill();
    }
    update() {
      this.vel.x *= this.friction; this.vel.y *= this.friction; this.vel.y += this.gravity;
      this.x += this.vel.x; this.y += this.vel.y; this.alpha -= 0.012;
    }
  }

  function createFirework(x, y) {
    const color = `hsl(${Math.random() * 360}, 100%, 65%)`;
    for (let i = 0; i < 45; i++) particles.push(new Particle(x, y, color));
  }

  function animate() {
    ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, i) => {
      if (p.alpha <= 0) particles.splice(i, 1);
      else { p.update(); p.draw(); }
    });
    requestAnimationFrame(animate);
  }
  animate();

  function initSurprise() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    
    // Putar Lagu
    const song = document.getElementById('hbdSong');
    song.play().catch(e => console.log("Musik butuh izin browser"));

    // Ledakan Kembang Api Awal
    for(let i=0; i<5; i++) {
        setTimeout(() => createFirework(Math.random()*canvas.width, Math.random()*canvas.height*0.5), i*300);
    }

    // Munculkan Lilin
    setTimeout(() => {
      document.getElementById('candle').style.display = 'block';
    }, 1000);

    // Munculkan Teks Berwarna
    setTimeout(() => {
      const words = ["Happy", "Birthday", "To", "You!"];
      const colors = ["#FF69B4", "#00F5FF", "#FFD700", "#32CD32"];
      const msg = document.getElementById('message');
      
      words.forEach((w, i) => {
        setTimeout(() => {
          const span = document.createElement('span');
          span.innerText = w;
          span.className = 'word';
          span.style.color = colors[i];
          msg.appendChild(span);
          setTimeout(() => span.classList.add('pop'), 50);
          createFirework(window.innerWidth/2 + (i*10), window.innerHeight/2 - 50);
        }, i * 600);
      });
    }, 1800);
  }
</script>
</body>
</html>
