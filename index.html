<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Good Night 🌙</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      position: relative;
    }

    .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.5;
      animation: twinkle var(--duration) infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Bintang Jatuh - Dibuat Lebih Panjang & Cepat */
    .shooting-star {
      position: absolute;
      top: -50px;
      width: 2px;
      height: 80px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,1));
      animation: shoot var(--duration) linear infinite;
      z-index: 0;
    }

    @keyframes shoot {
      0% { transform: translateY(0) translateX(0) rotate(-45deg); opacity: 1; }
      100% { transform: translateY(120vh) translateX(-120vh) rotate(-45deg); opacity: 0; }
    }

    .planet { position: absolute; border-radius: 50%; opacity: 0.7; z-index: 0; }
    .saturn { width: 60px; height: 60px; background: #f4d03f; top: 15%; left: 10%; box-shadow: 0 0 20px #9a7d0a; }
    .mars { width: 35px; height: 35px; background: #e74c3c; bottom: 20%; right: 15%; box-shadow: 0 0 15px #78281f; }

    .card {
      position: relative;
      z-index: 1;
      width: 85%;
      max-width: 350px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 30px 20px;
      text-align: center;
      color: white;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 22px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.5;
      transition: opacity 0.4s ease;
    }

    button {
      border: none;
      padding: 12px 35px;
      border-radius: 50px;
      background: white;
      color: #1e1e2f;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      border-radius: 20px;
      margin-top: 15px;
      display: none;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .moon {
      position: absolute;
      top: 40px;
      right: 40px;
      font-size: 50px;
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  </style>
</head>
<body>

<div class="stars" id="starContainer"></div>
<div class="planet saturn"></div>
<div class="planet mars"></div>
<div class="moon">🌙</div>

<div class="card">
  <h1 id="text">Haii</h1>
  <img id="meme" src="" alt="sleepy">
  <button onclick="nextText()" id="btn">Next ✨</button>
</div>

<script>
  const container = document.getElementById('starContainer');
  
  // Bintang Kelap-Kelip
  for (let i = 0; i < 100; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.width = Math.random() * 3 + 'px';
    star.style.height = star.style.width;
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
    container.appendChild(star);
  }

  // Bintang Jatuh Rewa-Rewi (Muncul tiap 1.5 detik)
  function createShootingStar() {
    const sStar = document.createElement('div');
    sStar.className = 'shooting-star';
    sStar.style.left = Math.random() * 150 + '%'; // Biar rewa rewi dari berbagai sisi
    sStar.style.setProperty('--duration', (Math.random() * 1 + 1) + 's');
    container.appendChild(sStar);
    setTimeout(() => sStar.remove(), 2500);
  }

  setInterval(createShootingStar, 1500); // Frekuensi lebih sering

  const texts = [
    "Haii",
    "Pengumuman penting",
    "Aku resmi mengundurkan diri",
    "Dari dunia sadar untuk sementara",
    "Karena kasur sudah memanggil",
    "Bantal juga sudah menunggu",
    "Jadi aku pamit dulu",
    "Besok kita lanjut hidup lagi",
    "Good night 😴",
    "" 
  ];

  // Pastikan link gambar ini benar sesuai file di GitHub kamu
  const images = [
    "https://githubusercontent.com", 
    "https://githubusercontent.com"
  ];

  let index = 0;

  function nextText() {
    index++;
    const textElement = document.getElementById("text");
    const btn = document.getElementById("btn");
    const meme = document.getElementById("meme");

    if (index < texts.length) {
      textElement.style.opacity = 0;
      
      setTimeout(() => {
        textElement.innerText = texts[index];
        textElement.style.opacity = 1;

        if (index === 8) { // Good Night
          meme.src = images[0];
          meme.style.display = "inline-block";
        } 
        else if (index === 9) { // Gambar Terakhir
          textElement.style.display = "none";
          meme.src = images[1];
          btn.style.display = "none";
        }
      }, 400);
    }
  }
</script>

</body>
</html>
