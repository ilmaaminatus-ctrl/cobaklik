<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Keren - Buatan Saya</title>
    <style>
        /* --- KODE CSS --- */
        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            overflow: hidden;
        }

        .kalkulator {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 320px;
            border: 1px solid #333;
        }

        #layar {
            width: 100%;
            height: 60px;
            background: none;
            border: none;
            color: white;
            text-align: right;
            font-size: 2.5rem;
            margin-bottom: 20px;
            outline: none;
            box-sizing: border-box;
        }

        .tombol-area {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border-radius: 15px;
            border: none;
            background: #333;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.2s;
        }

        button:active {
            background: #555;
            transform: scale(0.95);
        }

        .operator {
            color: #ff9800;
        }

        .sama-dengan {
            background: linear-gradient(45deg, #ff5722, #ff9800);
            grid-row: span 2;
            height: 132px;
            animation: warnaWarni 3s infinite alternate;
        }

        .nol {
            grid-column: span 2;
        }

        .hapus {
            color: #f44336;
        }

        @keyframes warnaWarni {
            from { filter: hue-rotate(0deg); }
            to { filter: hue-rotate(360deg); }
        }

        /* Efek Hover untuk Laptop/Desktop */
        @media (minor-side: 600px) {
            button:hover {
                background: #444;
                cursor: pointer;
            }
        }
    </style>
</head>
<body>

    <!-- --- KODE HTML --- -->
    <div class="kalkulator">
        <input type="text" id="layar" readonly value="0">
        <div class="tombol-area">
            <button class="hapus" onclick="hapus()">C</button>
            <button class="operator" onclick="input('/')">/</button>
            <button class="operator" onclick="input('*')">x</button>
            <button onclick="hapusSatu()">⌫</button>
            
            <button onclick="input('7')">7</button>
            <button onclick="input('8')">8</button>
            <button onclick="input('9')">9</button>
            <button class="operator" onclick="input('-')">-</button>
            
            <button onclick="input('4')">4</button>
            <button onclick="input('5')">5</button>
            <button onclick="input('6')">6</button>
            <button class="operator" onclick="input('+')">+</button>
            
            <button onclick="input('1')">1</button>
            <button onclick="input('2')">2</button>
            <button onclick="input('3')">3</button>
            <button class="sama-dengan" onclick="hitung()">=</button>
            
            <button class="nol" onclick="input('0')">0</button>
            <button onclick="input('.')">.</button>
        </div>
    </div>

    <!-- --- KODE JAVASCRIPT --- -->
    <script>
        const layar = document.getElementById('layar');

        function input(nilai) {
            if (layar.value === '0' || layar.value === 'Error') {
                layar.value = nilai;
            } else {
                layar.value += nilai;
            }
        }

        function hapus() {
            layar.value = '0';
        }

        function hapusSatu() {
            layar.value = layar.value.slice(0, -1);
            if (layar.value === '') layar.value = '0';
        }

        function hitung() {
            try {
                // eval() menghitung string matematika otomatis
                let hasil = eval(layar.value);
                // Membatasi angka di belakang koma agar tidak kepanjangan
                layar.value = Number.isInteger(hasil) ? hasil : hasil.toFixed(2);
            } catch (err) {
                layar.value = "Error";
                setTimeout(hapus, 1500);
            }
        }
    </script>
</body>
</html>
