<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! ✨</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      overflow: hidden;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

    .content { position: relative; z-index: 1; text-align: center; display: none; }

    /* Desain Kue Lucu */
    .cake { position: relative; width: 120px; height: 60px; background: #FFB6C1; border-radius: 10px 10px 0 0; margin: 40px auto 0; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .cake::before { content: ""; position: absolute; width: 140px; height: 40px; background: #FF69B4; bottom: -40px; left: -10px; border-radius: 10px; }
    .cake::after { content: ""; position: absolute; width: 160px; height: 15px; background: #fff; bottom: -50px; left: -20px; border-radius: 20px; }
    
    /* Lilin Hidup */
    .candle { position: absolute; width: 8px; height: 30px; background: #fff; top: -30px; left: 50%; transform: translateX(-50%); border-radius: 4px; display: none; }
    .flame { position: absolute; width: 12px; height: 18px; background: #FFA500; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; top: -18px; left: -2px; animation: flicker 0.1s infinite alternate; box-shadow: 0 0 10px #FFD700; }

    @keyframes flicker { from { transform: scale(1) rotate(-2deg); } to { transform: scale(1.1) rotate(2deg); } }

    /* Animasi Teks */
    #message { font-size: 2.5rem; margin-top: 80px; min-height: 60px; }
    .word { display: inline-block; opacity: 0; transform: scale(0.5); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin: 0 8px; }
    .word.pop { opacity: 1; transform: scale(1); }

    .btn-start { padding: 15px 30px; font-size: 1.2rem; background: #FF69B4; border: none; border-radius: 50px; color: white; cursor: pointer; box-shadow: 0 0 20px rgba(255,105,180,0.5); z-index: 2; transition: 0.3s; }
    .btn-start:hover { transform: scale(1.1); background: #ff1493; }
  </style>
</head>
<body>

<canvas id="fwCanvas"></canvas>

<button class="btn-start" id="startBtn" onclick="initSurprise()">Buka Kado ✨</button>

<div class="content" id="mainContent">
  <div class="cake">
    <div class="candle" id="candle">
      <div class="flame"></div>
    </div>
  </div>
  <div id="message"></div>
</div>

<script>
  const canvas = document.getElementById('fwCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      this.vel = { x: Math.random() * 6 - 3, y: Math.random() * 6 - 3 };
      this.alpha = 1; this.friction = 0.95; this.gravity = 0.1;
    }
    draw() {
      ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = this.color; ctx.fill();
    }
    update() {
      this.vel.x *= this.friction; this.vel.y *= this.friction; this.vel.y += this.gravity;
      this.x += this.vel.x; this.y += this.vel.y; this.alpha -= 0.015;
    }
  }

  function createFirework(x, y) {
    const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
    for (let i = 0; i < 40; i++) particles.push(new Particle(x, y, color));
  }

  function animate() {
    ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, i) => {
      if (p.alpha <= 0) particles.splice(i, 1);
      else { p.update(); p.draw(); }
    });
    requestAnimationFrame(animate);
  }
  animate();

  function initSurprise() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';

    // Munculkan kembang api acak
    let fwInterval = setInterval(() => {
      createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.7);
    }, 500);

    // Alur kemunculan kue
    setTimeout(() => {
      document.getElementById('candle').style.display = 'block';
      createFirework(window.innerWidth/2, window.innerHeight/2);
    }, 1500);

    // Munculkan Teks satu per satu
    setTimeout(() => {
      const words = ["Happy", "Birthday", "To", "You!"];
      const colors = ["#FF69B4", "#00FFFF", "#FFD700", "#ADFF2F"];
      const msg = document.getElementById('message');
      
      words.forEach((w, i) => {
        setTimeout(() => {
          const span = document.createElement('span');
          span.innerText = w;
          span.className = 'word';
          span.style.color = colors[i];
          msg.appendChild(span);
          setTimeout(() => span.classList.add('pop'), 50);
          createFirework(window.innerWidth/2 + (i * 20), window.innerHeight/2);
        }, i * 600);
      });
    }, 2500);

    // Stop kembang api otomatis setelah 10 detik agar tidak berat
    setTimeout(() => clearInterval(fwInterval), 10000);
  }
</script>
</body>
</html>
